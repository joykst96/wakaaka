# 운영 서버 (서버 ~/docker/wakaaka, DESIGN 10절 "운영 배포"). prod-up.sh가 이 파일을 ~/docker/wakaaka/compose.yml로 복사한다.
# .env(POSTGRES_PASSWORD)는 처음 배포할 때 서버에서 무작위로 만들고 저장소에는 두지 않는다. 테스트 서버와 다른 값이다.
# 터널은 서버 호스트의 cloudflared가 http://127.0.0.1:8491로 들어온다. 앱 포트는 127.0.0.1에만 연다(LAN에도 열지 않음).
# Postgres는 내부 네트워크에만 두고 포트를 열지 않는다.
name: wakaaka

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: wakaaka
      POSTGRES_DB: wakaaka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wakaaka", "-d", "wakaaka"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ./src
      dockerfile: deploy/Dockerfile
    # prod-up.sh가 빌드한 뒤 wakaaka-app:<커밋>도 붙인다(되돌리기용)
    image: wakaaka-app:latest
    environment:
      DATABASE_URL: postgres://wakaaka:${POSTGRES_PASSWORD}@postgres:5432/wakaaka
      PORT: "3000"
      HOST: 0.0.0.0
      # 터널로만 들어오므로 CF-Connecting-IP를 믿는다(DESIGN 9절 "속도 제한")
      TRUST_CF_IP: "1"
    ports:
      - "${WAKAAKA_BIND:-127.0.0.1}:${WAKAAKA_PORT:-8491}:3000"
    # 태그 CSV (prod-tags.sh가 따로 보낸다. 저장소에 넣지 않는다)
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [db, web]
    restart: unless-stopped

networks:
  db:
    internal: true
  web: {}

volumes:
  db: {}
